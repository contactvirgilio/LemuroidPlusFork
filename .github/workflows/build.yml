name: Build Lemuroid Plus APK

# Builds a downloadable APK on every push to main and when run by hand from the Actions tab.
# Publishing a GitHub Release (e.g. tag v1.0) builds the APK and attaches it to that release.
on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Every core is packed into the APK, so nothing is downloaded on the device.
      # The default Lemuroid cores come from the lemuroid-cores submodule; the extra cores below
      # are not part of it and are fetched from the official libretro build server.
      - name: Add extra cores and PPSSPP assets
        run: |
          set -euo pipefail
          JNI=lemuroid-app/src/bundle/jniLibs/arm64-v8a
          mkdir -p "$JNI" lemuroid-app/src/bundle/assets
          for core in bsnes mesen sameboy gpsp picodrive swanstation; do
            url="https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${core}_libretro_android.so.zip"
            echo "Downloading $url"
            curl -fsSL --retry 3 -o "/tmp/${core}.zip" "$url"
            unzip -o -q "/tmp/${core}.zip" -d "/tmp/${core}"
            so=$(find "/tmp/${core}" -name '*.so' | head -n 1)
            test -n "$so"
            cp "$so" "$JNI/lib${core}_libretro_android.so"
          done
          cp lemuroid-cores/assets/ppsspp.zip lemuroid-app/src/bundle/assets/ppsspp.zip
          ls -l "$JNI" lemuroid-app/src/bundle/assets

      - name: Build Lemuroid Plus release APK (all cores included)
        run: ./gradlew assembleFreeBundleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp lemuroid-app/build/outputs/apk/freeBundle/release/*.apk "dist/LemuroidPlus-${GITHUB_REF_NAME//\//-}.apk"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-plus-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.apk
