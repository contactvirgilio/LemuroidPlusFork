name: Build Lemuroid Plus APK

# Builds a downloadable APK on every push to main and when run by hand from the Actions tab.
# Publishing a GitHub Release (e.g. tag v1.0) builds the APK and attaches it to that release.
on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Every core is packed into the APK, so nothing is downloaded on the device.
      # The default Lemuroid cores come from the lemuroid-cores submodule; the extra cores below
      # are not part of it and are fetched from the official libretro build server.
      - name: Add extra cores and PPSSPP assets
        run: |
          set -euo pipefail
          JNI=lemuroid-app/src/bundle/jniLibs/arm64-v8a
          mkdir -p "$JNI" lemuroid-app/src/bundle/assets
          for core in bsnes mesen gpsp picodrive swanstation; do
            url="https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${core}_libretro_android.so.zip"
            echo "Downloading $url"
            curl -fsSL --retry 3 -o "/tmp/${core}.zip" "$url"
            unzip -o -q "/tmp/${core}.zip" -d "/tmp/${core}"
            so=$(find "/tmp/${core}" -name '*.so' | head -n 1)
            test -n "$so"
            cp "$so" "$JNI/lib${core}_libretro_android.so"
          done
          cp lemuroid-cores/assets/ppsspp.zip lemuroid-app/src/bundle/assets/ppsspp.zip
          ls -l "$JNI" lemuroid-app/src/bundle/assets

      # SameBoy is built from source: without a target sample rate from the frontend it outputs
      # audio at ~2 MHz, which overflows LibretroDroid's audio buffer and closes the game.
      # The patch fixes its output at 48 kHz. Its boot ROMs are assembled with RGBDS.
      - name: Build the SameBoy core
        run: |
          set -euo pipefail
          command -v hexdump >/dev/null || sudo apt-get install -y bsdextrautils
          mkdir -p /tmp/rgbds
          curl -fsSL --retry 3 -o /tmp/rgbds.tar.xz https://github.com/gbdev/rgbds/releases/download/v0.9.4/rgbds-linux-x86_64.tar.xz
          tar -xf /tmp/rgbds.tar.xz -C /tmp/rgbds
          SRC=/tmp/sameboy
          git clone --quiet https://github.com/LIJI32/SameBoy "$SRC"
          git -C "$SRC" checkout --quiet 19a7b14cfb10bb20b0f931b3d77359c11f866e17
          sed -i 's|GB_set_sample_rate(&gameboy\[i\], GB_get_clock_rate(&gameboy\[i\]) / 2);|GB_set_sample_rate(\&gameboy[i], 48000);|' "$SRC/libretro/libretro.c"
          grep -q 'GB_set_sample_rate(&gameboy\[i\], 48000);' "$SRC/libretro/libretro.c"
          make -C "$SRC" bootroms RGBDS=/tmp/rgbds/
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          (cd "$SRC/libretro/jni" && "$NDK/ndk-build" -j"$(nproc)" \
            APP_ABI=arm64-v8a APP_PLATFORM=android-21 BOOTROMS_DIR=build/bin/BootROMs)
          so=$(find "$SRC/libretro" -path '*arm64-v8a*' -name 'libretro.so' -not -path '*/obj/*' | head -n 1)
          test -n "$so"
          cp "$so" lemuroid-app/src/bundle/jniLibs/arm64-v8a/libsameboy_libretro_android.so

      # Genesis Plus GX PUNCHiUM by pav1388: Genesis Plus GX (July 2025) with support for Paprium's
      # cartridge chip, built from a pinned commit. Lemuroid Plus uses it only for Paprium.
      - name: Build the Paprium core
        run: |
          set -euo pipefail
          SRC=/tmp/gpgx-paprium
          git clone --quiet https://github.com/pav1388/Genesis-Plus-GX-PUNCHiUM "$SRC"
          git -C "$SRC" checkout --quiet 3849f3d3432df1d6320574e73695dd379ecef2b3
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          (cd "$SRC/libretro/jni" && "$NDK/ndk-build" -j"$(nproc)" \
            APP_ABI=arm64-v8a APP_PLATFORM=android-21 \
            APP_CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types -Wno-error=incompatible-pointer-types")
          so=$(find "$SRC/libretro" -path '*arm64-v8a*' -name 'libretro.so' -not -path '*/obj/*' | head -n 1)
          test -n "$so"
          cp "$so" lemuroid-app/src/bundle/jniLibs/arm64-v8a/libgenesis_plus_gx_paprium_libretro_android.so
          ls -l lemuroid-app/src/bundle/jniLibs/arm64-v8a/

      - name: Build Lemuroid Plus release APK (all cores included)
        run: ./gradlew assembleFreeBundleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp lemuroid-app/build/outputs/apk/freeBundle/release/*.apk "dist/LemuroidPlus-${GITHUB_REF_NAME//\//-}.apk"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: lemuroid-plus-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.apk
