name: Build Lemuroid Plus APK

# Builds a downloadable APK on every push to main and when run by hand from the Actions tab.
# Pushing a tag like v1.0 also creates a GitHub Release with the APK attached.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Lemuroid Plus release APK (cores download on demand)
        run: ./gradlew assembleFreeDynamicRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp lemuroid-app/build/outputs/apk/freeDynamic/release/*.apk "dist/LemuroidPlus-${GITHUB_REF_NAME//\//-}.apk"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-plus-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
